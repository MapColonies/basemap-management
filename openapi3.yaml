paths:
  /basemaps:
    get:
      operationId: listBasemaps
      tags:
        - basemaps
      summary: List all Basemaps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/basemap'
        '400':
          $ref: '#/components/responses/badRequest'
    post:
      operationId: createBasemap
      tags:
        - basemaps
      summary: Create a new Basemap. The thumbnail must be a ready URL - uploading the image itself is handled by catalog-web-app-bff (via data-service), not by this service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basemapWriteInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        '400':
          $ref: '#/components/responses/badRequest'
  /basemaps/import/validate:
    post:
      operationId: validateBasemapImport
      tags:
        - basemaps
      summary: Parse and validate a Basemap export package (ZIP) without persisting anything. Returns a review describing the Basemap, its default-role consequences, and the resolution of every catalog layer against this environment's catalog and MapProxy. Resolution failures are reported, never silently dropped.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  format: binary
                  description: The Basemap export ZIP package (basemap.json + thumbnail binary).
              required:
                - package
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importReview'
        '400':
          $ref: '#/components/responses/badRequest'
  /basemaps/{basemapId}:
    get:
      operationId: getBasemap
      tags:
        - basemaps
      summary: Get a single Basemap
      parameters:
        - $ref: '#/components/parameters/basemapId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      operationId: updateBasemap
      tags:
        - basemaps
      summary: Fully replace a Basemap
      parameters:
        - $ref: '#/components/parameters/basemapId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basemapWriteInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        '400':
          $ref: '#/components/responses/badRequest'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      operationId: deleteBasemap
      tags:
        - basemaps
      summary: Delete a Basemap
      parameters:
        - $ref: '#/components/parameters/basemapId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/notFound'
  /basemaps/{basemapId}/export:
    get:
      operationId: exportBasemap
      tags:
        - basemaps
      summary: Export a Basemap as a self-contained, portable ZIP package (configuration + thumbnail binary; no Raster tiles/data).
      parameters:
        - $ref: '#/components/parameters/basemapId'
      responses:
        '200':
          description: OK
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/notFound'
