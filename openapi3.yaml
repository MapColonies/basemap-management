openapi: 3.0.1
info:
  title: basemap-management
  description: >-
    Persistence and domain operations for Basemaps (ordered compositions of map
    layers) consumed by the MapColonies Main App and other REST clients.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /basemaps:
    get:
      operationId: listBasemaps
      tags:
        - basemaps
      summary: List all Basemaps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/basemap'
        '400':
          $ref: '#/components/responses/badRequest'
    post:
      operationId: createBasemap
      tags:
        - basemaps
      summary: >-
        Create a new Basemap. The thumbnail must already have been uploaded via
        POST /basemaps/thumbnails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basemapWriteInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        '400':
          $ref: '#/components/responses/badRequest'
  /basemaps/thumbnails:
    post:
      operationId: uploadBasemapThumbnail
      tags:
        - basemaps
      summary: >
        Upload a single 128x128 thumbnail image and return its persisted URL.
        This endpoint is intentionally decoupled from any Basemap id: it must
        work before a new Basemap has been created, as well as when replacing
        the thumbnail of an existing one. The physical storage key is generated
        by this service; the client never chooses it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - thumbnail
              properties:
                thumbnail:
                  type: string
                  format: binary
                  description: A single PNG or WebP image, exactly 128x128 pixels.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemapThumbnail'
        '400':
          $ref: '#/components/responses/badRequest'
  /basemaps/import/validate:
    post:
      operationId: validateBasemapImport
      tags:
        - basemaps
      summary: >
        Parse and validate a Basemap export package (ZIP) without persisting
        anything. Returns a review describing the Basemap, its default-role
        consequences, and the resolution of every catalog layer against this
        environment's catalog and MapProxy. Resolution failures are reported,
        never silently dropped.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - package
              properties:
                package:
                  type: string
                  format: binary
                  description: >-
                    The Basemap export ZIP package (basemap.json + thumbnail
                    binary).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importReview'
        '400':
          $ref: '#/components/responses/badRequest'
  /basemaps/{basemapId}:
    parameters:
      - $ref: '#/components/parameters/basemapId'
    get:
      operationId: getBasemap
      tags:
        - basemaps
      summary: Get a single Basemap
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      operationId: updateBasemap
      tags:
        - basemaps
      summary: Fully replace a Basemap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basemapWriteInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        '400':
          $ref: '#/components/responses/badRequest'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      operationId: deleteBasemap
      tags:
        - basemaps
      summary: Delete a Basemap
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/notFound'
  /basemaps/{basemapId}/export:
    parameters:
      - $ref: '#/components/parameters/basemapId'
    get:
      operationId: exportBasemap
      tags:
        - basemaps
      summary: >-
        Export a Basemap as a self-contained, portable ZIP package
        (configuration + thumbnail binary; no Raster tiles/data).
      responses:
        '200':
          description: OK
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/notFound'
security:
  - {}
components:
  parameters:
    basemapId:
      name: basemapId
      in: path
      required: true
      schema:
        type: string
  responses:
    badRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    notFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  schemas:
    error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    basemapThumbnail:
      type: object
      description: >-
        A persisted thumbnail reference. The binary image itself lives in blob
        storage; only its URL is part of the Basemap configuration.
      required:
        - url
        - width
        - height
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
          enum:
            - 128
        height:
          type: integer
          enum:
            - 128
    protocol:
      type: string
      description: >-
        Serving protocol of an external layer. The supported values come from
        the shared imagery protocol list (`WMS`, `WMTS`, `XYZ`, `OSM`,
        `MAPBOX_STYLE`, `BING_MAPS`) and are enforced by the service at
        request-validation time; the schema stays an open string so the list
        can grow in `@map-colonies/types` without a spec change.
    externalLayerDetails:
      type: object
      description: >
        Configuration for an externally-served layer. `protocol`/`name`/`url`
        are the only fields this service interprets; additional
        provider-specific keys are accepted and stored as-is.
      required:
        - protocol
        - name
        - url
      properties:
        protocol:
          $ref: '#/components/schemas/protocol'
        name:
          type: string
        url:
          type: string
      additionalProperties: true
    externalLayerSource:
      type: object
      description: >-
        An externally-served layer (not a catalog resource), as accepted by
        POST/PUT, persisted and exported.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - EXTERNAL
        details:
          $ref: '#/components/schemas/externalLayerDetails'
    domain:
      type: string
      description: >-
        Catalog domain of a catalog resource. Only RASTER is currently supported
        (VECTOR is future scope).
      enum:
        - RASTER
    rasterUniqueness:
      type: object
      description: >-
        Identifies a raster catalog product. This is also the persisted/portable
        identity - there is no environment-specific id. Both fields are
        optional: a missing, empty or unknown value is accepted and the layer is
        returned with status UNRESOLVED.
      properties:
        productId:
          type: string
          nullable: true
        productType:
          type: string
          nullable: true
          description: >-
            Raster product type (wire values as in @map-colonies/types, e.g.
            Orthophoto).
    catalogResourceLayerSource:
      type: object
      description: >-
        A catalog resource reference, as accepted by POST/PUT, persisted and
        exported.
      required:
        - type
        - domain
        - uniqueness
      properties:
        type:
          type: string
          enum:
            - CATALOG_RESOURCE
        domain:
          $ref: '#/components/schemas/domain'
        uniqueness:
          $ref: '#/components/schemas/rasterUniqueness'
    capability:
      type: object
      nullable: true
      description: >-
        MapProxy WMTS capability of a catalog layer.
      required:
        - id
      properties:
        id:
          type: string
          description: WMTS Layer ows:Identifier (= the catalog record's WMTS link name).
        style:
          type: array
          items:
            type: object
            required:
              - value
            properties:
              value:
                type: string
              isDefault:
                type: string
                nullable: true
        format:
          type: array
          items:
            type: string
        tileMatrixSet:
          type: array
          items:
            type: object
            required:
              - tileMatrixSetID
              - tileMatrixLabels
            properties:
              tileMatrixSetID:
                type: string
              tileMatrixLabels:
                type: array
                items:
                  type: string
        url:
          type: array
          items:
            type: object
            required:
              - format
              - resourceType
              - template
            properties:
              format:
                type: string
              resourceType:
                type: string
              template:
                type: string
    layerRasterRecord:
      type: object
      nullable: true
      description: >-
        The resolved catalog layer record (its product reference; all other
        record fields pass through).
      properties:
        productId:
          type: string
          nullable: true
        productType:
          type: string
          nullable: true
      additionalProperties: true
    status:
      type: string
      description: Resolution state of a layer source in read responses.
      enum:
        - RESOLVED
        - UNRESOLVED
    catalogResourceLayerSourceOutput:
      type: object
      description: >
        A catalog resource as returned by reads, write responses and the import
        review. Keeps its original reference. status is RESOLVED only when both
        the catalog record and its map server capability were found (layer and
        capabilities are then set); otherwise status is UNRESOLVED and layer and
        capabilities are null.
      required:
        - type
        - domain
        - uniqueness
        - status
        - layer
        - capabilities
      properties:
        type:
          type: string
          enum:
            - CATALOG_RESOURCE
        domain:
          $ref: '#/components/schemas/domain'
        uniqueness:
          $ref: '#/components/schemas/rasterUniqueness'
        status:
          $ref: '#/components/schemas/status'
        layer:
          $ref: '#/components/schemas/layerRasterRecord'
        capabilities:
          $ref: '#/components/schemas/capability'
    externalLayerSourceOutput:
      type: object
      description: >-
        An externally-served layer as returned by reads. External layers need no
        resolution, so status is always RESOLVED.
      required:
        - type
        - status
        - details
      properties:
        type:
          type: string
          enum:
            - EXTERNAL
        status:
          type: string
          enum:
            - RESOLVED
        details:
          $ref: '#/components/schemas/externalLayerDetails'
    basemapLayerSourceInput:
      description: >-
        A Basemap layer's source, as accepted by POST/PUT.
      oneOf:
        - $ref: '#/components/schemas/catalogResourceLayerSource'
        - $ref: '#/components/schemas/externalLayerSource'
      discriminator:
        propertyName: type
        mapping:
          CATALOG_RESOURCE: '#/components/schemas/catalogResourceLayerSource'
          EXTERNAL: '#/components/schemas/externalLayerSource'
    basemapLayerSourceOutput:
      description: >-
        A Basemap layer's source, as returned by reads, write responses and the
        import review.
      oneOf:
        - $ref: '#/components/schemas/catalogResourceLayerSourceOutput'
        - $ref: '#/components/schemas/externalLayerSourceOutput'
      discriminator:
        propertyName: type
        mapping:
          CATALOG_RESOURCE: '#/components/schemas/catalogResourceLayerSourceOutput'
          EXTERNAL: '#/components/schemas/externalLayerSourceOutput'
    basemapLayerInput:
      type: object
      required:
        - id
        - order
        - opacity
        - source
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 0
        opacity:
          type: number
          minimum: 0
          maximum: 1
        shouldBeUsedInModelDraping:
          type: boolean
          description: >-
            Only meaningful for layer sources eligible for 3D model draping.
            Omitted entirely for ineligible sources - never sent as
            false/disabled.
        source:
          $ref: '#/components/schemas/basemapLayerSourceInput'
    basemapLayerOutput:
      type: object
      required:
        - id
        - order
        - opacity
        - source
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 0
        opacity:
          type: number
          minimum: 0
          maximum: 1
        shouldBeUsedInModelDraping:
          type: boolean
        source:
          $ref: '#/components/schemas/basemapLayerSourceOutput'
    basemap:
      type: object
      required:
        - id
        - name
        - thumbnail
        - isCurrent
        - isForPreview
        - layers
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
        thumbnail:
          $ref: '#/components/schemas/basemapThumbnail'
        isCurrent:
          type: boolean
          description: >-
            At most one Basemap may have isCurrent=true. Default for the Cesium
            map viewer.
        isForPreview:
          type: boolean
          description: >-
            At most one Basemap may have isForPreview=true. Default for
            OpenLayers preview viewers. Independent of isCurrent.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/basemapLayerOutput'
    basemapWriteInput:
      type: object
      description: >-
        Same shape as a persisted Basemap, minus the server-assigned id. Catalog
        layer sources are references (no status, layer or capabilities).
      required:
        - name
        - thumbnail
        - isCurrent
        - isForPreview
        - layers
      properties:
        name:
          type: string
          minLength: 1
        thumbnail:
          $ref: '#/components/schemas/basemapThumbnail'
        isCurrent:
          type: boolean
        isForPreview:
          type: boolean
        layers:
          type: array
          items:
            $ref: '#/components/schemas/basemapLayerInput'
    importReviewLayer:
      description: >
        One layer of an imported package, resolved against this environment
        exactly like a GET. A catalog source with status UNRESOLVED carries the
        dangling reference the user must resolve/replace or remove before saving.
      allOf:
        - $ref: '#/components/schemas/basemapLayerOutput'
    importReviewRoleConflict:
      type: object
      required:
        - basemapId
        - basemapName
      properties:
        basemapId:
          type: string
        basemapName:
          type: string
    importReview:
      type: object
      description: >-
        A draft/review model. It is never itself persisted and must never be
        accepted by the Basemap write endpoints.
      required:
        - name
        - isCurrent
        - isForPreview
        - thumbnail
        - layers
      properties:
        name:
          type: string
        isCurrent:
          type: boolean
        isForPreview:
          type: boolean
        currentRoleConflict:
          description: >-
            Present when isCurrent=true and another Basemap currently owns that
            role.
          allOf:
            - $ref: '#/components/schemas/importReviewRoleConflict'
        previewRoleConflict:
          description: >-
            Present when isForPreview=true and another Basemap currently owns
            that role.
          allOf:
            - $ref: '#/components/schemas/importReviewRoleConflict'
        thumbnail:
          type: object
          required:
            - included
          properties:
            included:
              type: boolean
            width:
              type: integer
            height:
              type: integer
            mimeType:
              type: string
            dataBase64:
              type: string
              description: >-
                The thumbnail binary, base64-encoded, for direct use as
                in-memory editor state. Present only when included=true.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/importReviewLayer'
