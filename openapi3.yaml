openapi: 3.0.1
info:
  title: basemap-management
  description: Persistence and domain operations for Basemaps (ordered compositions of map layers) consumed by the MapColonies Main App and other REST clients.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /basemaps:
    get:
      operationId: listBasemaps
      tags:
        - basemaps
      summary: List all Basemaps
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/basemap'
        400:
          $ref: '#/components/responses/badRequest'
    post:
      operationId: createBasemap
      tags:
        - basemaps
      summary: Create a new Basemap. The thumbnail must already have been uploaded via POST /basemaps/thumbnails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basemapWriteInput'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        400:
          $ref: '#/components/responses/badRequest'
  /basemaps/thumbnails:
    post:
      operationId: uploadBasemapThumbnail
      tags:
        - basemaps
      summary: >
        Upload a single 128x128 thumbnail image and return its persisted URL.
        This endpoint is intentionally decoupled from any Basemap id: it must work before a new
        Basemap has been created, as well as when replacing the thumbnail of an existing one.
        The physical storage key is generated by this service; the client never chooses it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - thumbnail
              properties:
                thumbnail:
                  type: string
                  format: binary
                  description: A single PNG or WebP image, exactly 128x128 pixels.
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemapThumbnail'
        400:
          $ref: '#/components/responses/badRequest'
  /basemaps/import/validate:
    post:
      operationId: validateBasemapImport
      tags:
        - basemaps
      summary: >
        Parse and validate a Basemap export package (ZIP) without persisting anything.
        Returns a review describing the Basemap, its default-role consequences, and the
        resolution status of every Raster-backed layer against this environment's Raster Catalog.
        Resolution failures are reported, never silently dropped.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - package
              properties:
                package:
                  type: string
                  format: binary
                  description: The Basemap export ZIP package (basemap.json + thumbnail binary).
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importReview'
        400:
          $ref: '#/components/responses/badRequest'
  /basemaps/{basemapId}:
    parameters:
      - $ref: '#/components/parameters/basemapId'
    get:
      operationId: getBasemap
      tags:
        - basemaps
      summary: Get a single Basemap
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        404:
          $ref: '#/components/responses/notFound'
    put:
      operationId: updateBasemap
      tags:
        - basemaps
      summary: Fully replace a Basemap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basemapWriteInput'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basemap'
        400:
          $ref: '#/components/responses/badRequest'
        404:
          $ref: '#/components/responses/notFound'
    delete:
      operationId: deleteBasemap
      tags:
        - basemaps
      summary: Delete a Basemap
      responses:
        204:
          description: No Content
        404:
          $ref: '#/components/responses/notFound'
  /basemaps/{basemapId}/export:
    parameters:
      - $ref: '#/components/parameters/basemapId'
    get:
      operationId: exportBasemap
      tags:
        - basemaps
      summary: Export a Basemap as a self-contained, portable ZIP package (configuration + thumbnail binary; no Raster tiles/data).
      responses:
        200:
          description: OK
          content:
            application/zip:
              schema:
                type: string
                format: binary
        404:
          $ref: '#/components/responses/notFound'
security:
  - {}
components:
  parameters:
    basemapId:
      name: basemapId
      in: path
      required: true
      schema:
        type: string
  responses:
    badRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    notFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  schemas:
    error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    basemapThumbnail:
      type: object
      description: A persisted thumbnail reference. The binary image itself lives in blob storage; only its URL is part of the Basemap configuration.
      required:
        - url
        - width
        - height
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
          enum: [128]
        height:
          type: integer
          enum: [128]
    protocol:
      type: string
      description: Serving protocol of an external layer.
      enum: [XYZ, WMTS, WMS, OSM]
    externalLayerDetails:
      type: object
      description: >
        Configuration for an externally-served layer. `protocol`/`name`/`url` are the only fields
        this service interprets; additional provider-specific keys are accepted and stored as-is.
      required:
        - protocol
        - name
        - url
      properties:
        protocol:
          $ref: '#/components/schemas/protocol'
        name:
          type: string
        url:
          type: string
      additionalProperties: true
    externalLayerSource:
      type: object
      description: An externally-served layer (not a managed Raster resource). Identical on write and read.
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum: [EXTERNAL]
        details:
          $ref: '#/components/schemas/externalLayerDetails'
    rasterResourceLayerSource:
      type: object
      description: >
        A managed Raster resource, addressed by its portable identity (productId + productType).
        This is also the persisted identity - there is no separate environment-specific id.
      required:
        - type
        - productId
        - productType
      properties:
        type:
          type: string
          enum: [RASTER_RESOURCE]
        productId:
          type: string
        productType:
          type: string
    rasterResolvedResourceLayerSource:
      type: object
      description: >
        A managed Raster resource, resolved against this environment's Raster Catalog at read time.
        `layer` is a placeholder for whatever shape the Raster Catalog integration ends up returning -
        unconstrained until that contract is confirmed (see README).
      required:
        - type
        - layer
      properties:
        type:
          type: string
          enum: [RASTER_RESOLVED_RESOURCE]
        layer: {}
    basemapLayerSourceInput:
      description: A Basemap layer's source, as accepted by POST/PUT.
      oneOf:
        - $ref: '#/components/schemas/rasterResourceLayerSource'
        - $ref: '#/components/schemas/externalLayerSource'
      discriminator:
        propertyName: type
        mapping:
          RASTER_RESOURCE: '#/components/schemas/rasterResourceLayerSource'
          EXTERNAL: '#/components/schemas/externalLayerSource'
    basemapLayerSourceOutput:
      description: A Basemap layer's source, as returned by GET - Raster resources arrive pre-resolved.
      oneOf:
        - $ref: '#/components/schemas/rasterResolvedResourceLayerSource'
        - $ref: '#/components/schemas/externalLayerSource'
      discriminator:
        propertyName: type
        mapping:
          RASTER_RESOLVED_RESOURCE: '#/components/schemas/rasterResolvedResourceLayerSource'
          EXTERNAL: '#/components/schemas/externalLayerSource'
    basemapLayerInput:
      type: object
      required:
        - id
        - order
        - opacity
        - source
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 0
        opacity:
          type: number
          minimum: 0
          maximum: 1
        shouldBeUsedInModelDraping:
          type: boolean
          description: Only meaningful for layer sources eligible for 3D model draping. Omitted entirely for ineligible sources - never sent as false/disabled.
        source:
          $ref: '#/components/schemas/basemapLayerSourceInput'
    basemapLayerOutput:
      type: object
      required:
        - id
        - order
        - opacity
        - source
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 0
        opacity:
          type: number
          minimum: 0
          maximum: 1
        shouldBeUsedInModelDraping:
          type: boolean
        source:
          $ref: '#/components/schemas/basemapLayerSourceOutput'
    basemap:
      type: object
      required:
        - id
        - name
        - thumbnail
        - isCurrent
        - isForPreview
        - layers
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
        thumbnail:
          $ref: '#/components/schemas/basemapThumbnail'
        isCurrent:
          type: boolean
          description: At most one Basemap may have isCurrent=true. Default for the Cesium map viewer.
        isForPreview:
          type: boolean
          description: At most one Basemap may have isForPreview=true. Default for OpenLayers preview viewers. Independent of isCurrent.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/basemapLayerOutput'
    basemapWriteInput:
      type: object
      description: Same shape as a persisted Basemap, minus the server-assigned id, and with unresolved Raster layer sources.
      required:
        - name
        - thumbnail
        - isCurrent
        - isForPreview
        - layers
      properties:
        name:
          type: string
          minLength: 1
        thumbnail:
          $ref: '#/components/schemas/basemapThumbnail'
        isCurrent:
          type: boolean
        isForPreview:
          type: boolean
        layers:
          type: array
          items:
            $ref: '#/components/schemas/basemapLayerInput'
    importReviewLayer:
      type: object
      description: One layer of an imported package, after attempting to verify every Raster-backed layer against this environment's Raster Catalog.
      required:
        - status
        - opacity
      properties:
        status:
          type: string
          enum: [RESOLVED, UNRESOLVED]
        opacity:
          type: number
          minimum: 0
          maximum: 1
        shouldBeUsedInModelDraping:
          type: boolean
        source:
          description: Present on every layer - the same shape POST/PUT accepts. For an UNRESOLVED Raster layer, this is the dangling productId/productType the user must resolve/replace or remove before saving.
          allOf:
            - $ref: '#/components/schemas/basemapLayerSourceInput'
    importReviewRoleConflict:
      type: object
      required:
        - basemapId
        - basemapName
      properties:
        basemapId:
          type: string
        basemapName:
          type: string
    importReview:
      type: object
      description: A draft/review model. It is never itself persisted and must never be accepted by the Basemap write endpoints.
      required:
        - name
        - isCurrent
        - isForPreview
        - thumbnail
        - layers
      properties:
        name:
          type: string
        isCurrent:
          type: boolean
        isForPreview:
          type: boolean
        currentRoleConflict:
          description: Present when isCurrent=true and another Basemap currently owns that role.
          allOf:
            - $ref: '#/components/schemas/importReviewRoleConflict'
        previewRoleConflict:
          description: Present when isForPreview=true and another Basemap currently owns that role.
          allOf:
            - $ref: '#/components/schemas/importReviewRoleConflict'
        thumbnail:
          type: object
          required:
            - included
          properties:
            included:
              type: boolean
            width:
              type: integer
            height:
              type: integer
            mimeType:
              type: string
            dataBase64:
              type: string
              description: The thumbnail binary, base64-encoded, for direct use as in-memory editor state. Present only when included=true.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/importReviewLayer'
