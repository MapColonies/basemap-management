nameOverride: ''
fullnameOverride: ''
# --------------- common --------------
commonLabels:
commonAnnotations:
mclabels:
  component: backend
# ----------- initContainers ----------
volumePermissions:
  enabled: false
# ------ volumes and volumeMounts -----
persistence:
  enabled: false
# ----------- command/debug -----------
diagnosticMode:
  enabled: false
# --------- MAIN_OBJECT_BLOCK ---------
configValues:
  deploymentAnnotations:
  autoscaling:
    enabled: false
  replicaCount: 1
  podAnnotations:
    enabled: true
    resetOnConfigChange: false
    annotations:
  prometheus:
    scrape: false
  metrics:
    enabled: false
  tracing:
    enabled: false
  podSecurityContext:
    enabled: false
  # ----------- containers ------------
  image:
    repository: basemap-management
    tag: latest
    pullPolicy: Always
    debug: false
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
  extraEnvVars:
    - name: SERVER_PORT
      value: '{{ .Values.configValues.containerPorts.http }}'
  extraEnvVarsCM: '{{ template "common.names.fullname" . }}'
  extraEnvVarsSecret:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  containerPorts:
    http: 8080
    https: 443
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: false
env:
  logLevel: info
  logPrettyPrintEnabled: false
  responseCompressionEnabled: true
  requestPayloadLimit: 1mb
  configName: basemap-management
  configVersion: latest
  configOfflineMode: false
  opentelemetryLoggingEnabled: true
  otlpLoggerEndpointUrl: http://localhost:4317
  basemapsConfigName: basemaps
  basemapsConfigSchemaId: https://mapcolonies.com/common/basemaps/v1
  rasterCatalogUrl: ''
  mapServerUrl: ''
  accessToken:
    attributeName: token
    injectionType: queryParam
    tokenValue: ''
  importPackageMaxSizeBytes: 10485760 # 10MB - generous for a tiny JSON doc + one 128x128 image
route:
  enabled: true
  annotations:
  timeout:
    enabled: false
    duration: 60s
  routesMapping:
    - hostname:
      path: /
      suffix:
  targetPort: http
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
  extraRules:
ingress:
  enabled: false
  apiVersion:
  type: nginx-org
  annotations:
  pathType: Prefix
  hostname:
  extraHosts: []
  extraPaths: []
  path: /basemap-management
  extraRules: []
  extraTls: []
  selfSigned: false
  tls: true
  cors:
    enabled: true
    origin: '*'
service:
  annotations:
  ports:
    http: 80
  protocol: TCP
serviceAccount:
  create: false
