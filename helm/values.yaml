nameOverride: ''
fullnameOverride: ''
# --------------- common --------------
commonLabels:
commonAnnotations:
# ----------- initContainers ----------
volumePermissions:
  enabled: false
# ------ volumes and volumeMounts -----
persistence:
  enabled: false
# ----------- command/debug -----------
diagnosticMode:
  enabled: false
# --------- MAIN_OBJECT_BLOCK ---------
configValues:
  deploymentAnnotations:
  autoscaling:
    enabled: false
  replicaCount: 1
  podAnnotations:
    enabled: true
    resetOnConfigChange: false
    annotations:
  prometheus:
    scrape: false
  metrics:
    enabled: false
  tracing:
    enabled: false
  podSecurityContext:
    enabled: false
  # ----------- containers ------------
  image:
    repository: basemap-management
    tag: latest
    pullPolicy: Always
    debug: false
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
  extraEnvVars:
    - name: SERVER_PORT
      value: '{{ .Values.configValues.containerPorts.http }}'
  extraEnvVarsCM: '{{ template "common.names.fullname" . }}'
  extraEnvVarsSecret:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  containerPorts:
    http: 8080
    https: 443
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: false
env:
  logLevel: info
  logPrettyPrintEnabled: false
  responseCompressionEnabled: true
  requestPayloadLimit: 1mb

telemetry:
  logger:
    opentelemetryOptions:
      enabled: true
      url: http://localhost:4317

route:
  enabled: true
  annotations:
  timeout:
    enabled: false
    duration: 60s
  routesMapping:
    - hostname:
      path: /
      suffix:
  targetPort: http
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
  extraRules:
ingress:
  enabled: false
  apiVersion:
  type: nginx-org
  annotations:
  pathType: Prefix
  hostname:
  extraHosts: []
  extraPaths: []
  path: /basemap-management
  extraRules: []
  extraTls: []
  selfSigned: false
  tls: true
  cors:
    enabled: true
    origin: '*'
service:
  annotations:
  ports:
    http: 80
  protocol: TCP
serviceAccount:
  create: false

# --------------------------------------------------------------------------
# basemap-management-specific configuration below - not part of the generic
# mc-chart.* mechanism, no lookup-tables equivalent.
# --------------------------------------------------------------------------

# @map-colonies/config's own bootstrap options (src/common/config.ts calls initConfig() with no
# explicit offlineMode, unlike lookup-tables which hardcodes initConfig(true) - so these env vars
# are live and read internally by the @map-colonies/config package itself).
configManagement:
  offlineMode: false
  name: 'basemap-management'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

# Basemap-domain settings (A.10). Read directly from process.env in src/common/env.ts rather than
# through @map-colonies/config, because the shared commonBoilerplateV3 schema that package validates
# against has no confirmed process yet for extending it with a service's own domain settings.
basemapManagement:
  configServer:
    name: 'basemaps'
    # Not yet registered anywhere config-server schemas are maintained - see README "Unresolved
    # external contracts". Do not invent a different id once registration happens; update this value.
    schemaId: 'https://mapcolonies.com/basemaps/v1'
  # Placeholder: the future binary-persistence data-service (A.12) does not exist yet.
  dataService:
    url: ''
  rasterCatalog:
    # Placeholder: the real Raster pycsw Catalog HTTP contract is not confirmed yet.
    url: ''
    # Only 'stub' is implemented. Setting 'http' fails the service at startup rather than silently
    # using the stub - see containerConfig.ts#rasterCatalogClientProvider.
    mode: 'stub'
  uploadLimits:
    thumbnailMaxSizeBytes: 2097152 # 2MB - a 128x128 PNG/WebP comes nowhere close to this
    importPackageMaxSizeBytes: 10485760 # 10MB - generous for a tiny JSON doc + one 128x128 image
